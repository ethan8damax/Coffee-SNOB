<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html {
        height: 100%;
      }
      /* Pinned to the viewport rather than sized with a viewport unit, so the
         page is exactly the visible area and an iOS rubber-band bounce has
         nothing to reveal. NOTE: no `height` here on purpose — an explicit
         height out-ranks the top/bottom pair.
         (This is not what fixed the strip below the tab bar; the status-bar
         style was. Measured: body, #root and the tab bar's bottom edge were
         already identical to innerHeight in every mode.) */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /* colors.paper — so an iOS rubber-band overscroll bounce (or any
           other momentary gap) shows the app's own background, not a stark
           white flash/line. */
        background: #f0ecdf;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        /* body is now fixed to the screen, so 100% of it is the real screen. */
        height: 100%;
        flex: 1;
      }
      /* iOS Safari quirk (github.com/w3c/csswg-drafts, Apple dev forums, well-
         documented): the app's own layout reaches the bottom of the viewport
         correctly — measured on an iPhone 15 in standalone, the tab bar's
         bottom edge and the page's bottom edge are the same pixel. What used
         to leave a cream strip below it was the status-bar style, not this
         CSS; see the note on that meta tag below. */
    </style>

    <!-- Add to Home Screen: standalone display (no URL bar/back button).

         status-bar-style was "black-translucent" so the map could draw under
         the status bar. Measured on an iPhone 15 in standalone, that costs a
         59pt strip: iOS draws the page from y=0 but sizes the viewport at
         793 against an 852 screen, and the leftover 59pt at the bottom is
         OUTSIDE the web view — the page cannot paint there. That strip, not
         any app-side layout bug, is the cream band that kept showing under
         the tab bar. Growing the document only clipped the bar, since the
         extra height lands past the viewport's bottom edge.

         "default" gives the web view the normal 59..852 box, so the page
         reaches the real bottom and the strip cannot exist. The status bar
         it draws is no longer the hardcoded white it used to be: since iOS
         15, theme-color tints it, so it reads as the app's own paper. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- colors.paper — tints the iOS status bar and Safari's chrome to match. -->
    <meta name="theme-color" content="#f0ecdf" />
    <meta name="apple-mobile-web-app-title" content="Coffee Snob" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* No focus ring on text inputs — Chrome/Safari show :focus-visible on
         a text field even for a plain mouse click (not just Tab), since
         typing next needs the keyboard either way; the blinking caret is
         already the field's own "you're in me" affordance, so the ring is
         redundant here. (Buttons/links keep their normal focus outline —
         this only touches text entry.) */
      input, textarea { outline: none; }

      /* iOS Safari auto-zooms the page on focus for any input under 16px —
         the viewport lock above blocks pinch/manual zoom, but not this.
         !important because react-native-web sets font-size via its own
         atomic CSS classes, which a plain selector can't out-rank. */
      input, textarea { font-size: 16px !important; }

      /* Chrome/Safari force autofilled inputs to a yellow background —
         they don't allow overriding it with a plain background-color, only
         this inset-box-shadow trick. Matches colors.paper/colors.ink
         (every input here sits directly on the paper background, no boxed
         card behind it). The long transition delays the browser's own
         yellow from ever painting in the first place. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #f0ecdf inset;
        -webkit-text-fill-color: #161310;
        caret-color: #161310;
        transition: background-color 9999s ease-in-out 0s;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

  </body>
</html>
