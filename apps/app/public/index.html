<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* colors.paper — so an iOS rubber-band overscroll bounce (or any
           other momentary gap) shows the app's own background, not a stark
           white flash/line. */
        background: #f0ecdf;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Add to Home Screen: standalone display (no URL bar/back button),
         matching the app's own chrome so there's no visible seam.
         status-bar-style is one of iOS's 3 fixed options, not a color —
         "default" renders as a plain WHITE bar no matter what, which is
         what the white box at the top of the map was: iOS's own hardcoded
         bar, not a rendering gap. "black-translucent" makes it transparent
         instead, so the app's own content (the map) draws underneath it —
         paired with viewport-fit=cover above and real safe-area-top
         padding on the map's search bar (map-controls.tsx) so it still
         clears the notch/Dynamic Island rather than sitting under it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coffee Snob" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* No focus ring on text inputs — Chrome/Safari show :focus-visible on
         a text field even for a plain mouse click (not just Tab), since
         typing next needs the keyboard either way; the blinking caret is
         already the field's own "you're in me" affordance, so the ring is
         redundant here. (Buttons/links keep their normal focus outline —
         this only touches text entry.) */
      input, textarea { outline: none; }

      /* iOS Safari auto-zooms the page on focus for any input under 16px —
         the viewport lock above blocks pinch/manual zoom, but not this.
         !important because react-native-web sets font-size via its own
         atomic CSS classes, which a plain selector can't out-rank. */
      input, textarea { font-size: 16px !important; }

      /* Chrome/Safari force autofilled inputs to a yellow background —
         they don't allow overriding it with a plain background-color, only
         this inset-box-shadow trick. Matches colors.paper/colors.ink
         (every input here sits directly on the paper background, no boxed
         card behind it). The long transition delays the browser's own
         yellow from ever painting in the first place. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #f0ecdf inset;
        -webkit-text-fill-color: #161310;
        caret-color: #161310;
        transition: background-color 9999s ease-in-out 0s;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
