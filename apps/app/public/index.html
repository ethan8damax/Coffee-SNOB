<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html {
        height: 100%;
      }
      /* iOS standalone (Add to Home Screen) under-reports every viewport
         unit — 100vh and 100dvh both came up ~70pt short of the screen,
         which is the gap that kept showing below the tab bar. Fixing the
         body to the initial containing block sizes it against the screen
         itself. NOTE: no `height` here on purpose — an explicit height
         out-ranks the top/bottom pair and puts the short viewport unit
         straight back (that's what defeated the first attempt at this). */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /* colors.paper — so an iOS rubber-band overscroll bounce (or any
           other momentary gap) shows the app's own background, not a stark
           white flash/line. */
        background: #f0ecdf;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        /* body is now fixed to the screen, so 100% of it is the real screen. */
        height: 100%;
        flex: 1;
      }
      /* iOS Safari quirk (github.com/w3c/csswg-drafts, Apple dev forums, well-
         documented): in standalone "Add to Home Screen" mode there's no
         toolbar to anchor a safe area to, so env(safe-area-inset-bottom)
         reports 0 — and separately, height:100%/100vh don't reliably reach
         the true bottom of the visual viewport in standalone mode either.
         Both together are what left a gap of this cream background color
         between the app's own content (which pads for a *reported* 0 inset)
         and the physical screen edge. 100dvh (iOS 15.4+, this app's whole
         audience) is the fix for the viewport-height half of that; nothing
         further is needed for the safe-area-inset half since a 0 report
         just means "no inset to add" here, which is now actually correct
         once the real viewport height is being measured. */
    </style>

    <!-- Add to Home Screen: standalone display (no URL bar/back button),
         matching the app's own chrome so there's no visible seam.
         status-bar-style is one of iOS's 3 fixed options, not a color —
         "default" renders as a plain WHITE bar no matter what, which is
         what the white box at the top of the map was: iOS's own hardcoded
         bar, not a rendering gap. "black-translucent" makes it transparent
         instead, so the app's own content (the map) draws underneath it —
         paired with viewport-fit=cover above and real safe-area-top
         padding on the map's search bar (map-controls.tsx) so it still
         clears the notch/Dynamic Island rather than sitting under it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coffee Snob" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* No focus ring on text inputs — Chrome/Safari show :focus-visible on
         a text field even for a plain mouse click (not just Tab), since
         typing next needs the keyboard either way; the blinking caret is
         already the field's own "you're in me" affordance, so the ring is
         redundant here. (Buttons/links keep their normal focus outline —
         this only touches text entry.) */
      input, textarea { outline: none; }

      /* iOS Safari auto-zooms the page on focus for any input under 16px —
         the viewport lock above blocks pinch/manual zoom, but not this.
         !important because react-native-web sets font-size via its own
         atomic CSS classes, which a plain selector can't out-rank. */
      input, textarea { font-size: 16px !important; }

      /* Chrome/Safari force autofilled inputs to a yellow background —
         they don't allow overriding it with a plain background-color, only
         this inset-box-shadow trick. Matches colors.paper/colors.ink
         (every input here sits directly on the paper background, no boxed
         card behind it). The long transition delays the browser's own
         yellow from ever painting in the first place. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #f0ecdf inset;
        -webkit-text-fill-color: #161310;
        caret-color: #161310;
        transition: background-color 9999s ease-in-out 0s;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- Opt-in layout readout: only renders for /?debug=layout, so it can't
         reach anyone who didn't ask for it. Exists because the gap below the
         tab bar isn't reproducible off-device — this prints the real numbers
         (which box is short, and by how much) instead of inferring them from
         source. Delete once the gap is understood. -->
    <script>
      if (location.search.includes("debug=layout")) {
        var probe = document.createElement("div");
        probe.style.cssText =
          "position:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none";
        document.body.appendChild(probe);

        var out = document.createElement("pre");
        out.style.cssText =
          "position:fixed;top:0;left:0;z-index:99999;margin:0;padding:6px 8px;font:11px/1.35 ui-monospace,monospace;color:#f0ecdf;background:rgba(22,19,16,.92);white-space:pre";
        document.body.appendChild(out);

        // Magenta bar pinned to the very bottom of the page. Where it lands on
        // screen answers the question the numbers can't: if it sits ABOVE the
        // cream strip, the page genuinely ends there and nothing the page does
        // can fill the strip. If it's hidden behind the strip, the page does
        // reach the bottom and the strip is something drawing over it.
        var edge = document.createElement("div");
        edge.style.cssText =
          "position:fixed;left:0;right:0;bottom:0;height:4px;z-index:99999;background:#ff00aa;pointer-events:none";
        document.body.appendChild(edge);

        var read = function () {
          var cs = getComputedStyle(probe);
          var root = document.getElementById("root");
          var vv = window.visualViewport;
          out.textContent = [
            "screen.height     " + screen.height,
            "innerHeight       " + window.innerHeight,
            "visualViewport.h  " + (vv ? Math.round(vv.height) : "n/a"),
            "doc.clientHeight  " + document.documentElement.clientHeight,
            "body rect.h       " + Math.round(document.body.getBoundingClientRect().height),
            "#root rect.h      " + (root ? Math.round(root.getBoundingClientRect().height) : "n/a"),
            "#root child h     " + (root && root.firstElementChild ? Math.round(root.firstElementChild.getBoundingClientRect().height) : "n/a"),
            "safe-area T/B     " + cs.paddingTop + " / " + cs.paddingBottom,
            "dpr               " + window.devicePixelRatio,
            "standalone        " + (navigator.standalone === true),
          ].join("\n");
        };
        read();
        addEventListener("resize", read);
        addEventListener("orientationchange", read);
        if (window.visualViewport) window.visualViewport.addEventListener("resize", read);
        setTimeout(read, 1500);
      }
    </script>
  </body>
</html>
