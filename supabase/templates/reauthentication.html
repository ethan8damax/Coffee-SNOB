<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your Coffee Snob code</title>
</head>
<body style="margin:0;padding:0;background:#f0ecdf;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your one-time code to confirm it's you.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f0ecdf;">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
    <tr><td style="padding:0 0 20px 4px;">
      <a href="https://app.coffeesnobproject.com" style="text-decoration:none;"><img src="https://app.coffeesnobproject.com/email/snob-logo.png" width="132" alt="Snob" style="display:block;border:0;height:auto;width:132px;"></a>
    </td></tr>
    <tr><td style="background:#faf8ef;border:1px solid #dcd7c8;border-radius:2px;padding:36px 32px 32px 32px;">
      <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10.5px;line-height:14px;letter-spacing:1.4px;text-transform:uppercase;color:#c46a17;font-weight:700;">Confirm it's you</div>
      <h1 style="margin:14px 0 14px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:32px;line-height:36px;letter-spacing:-0.9px;font-weight:800;color:#161310;">Your one-time code.</h1>
      <p style="margin:0 0 28px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#4b423a;">Enter this code in Coffee Snob to confirm the change you're making. It expires soon.</p>
      <div style="display:inline-block;background:#f0ecdf;border:1px solid #dcd7c8;border-radius:2px;padding:16px 22px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:30px;line-height:32px;letter-spacing:8px;font-weight:800;color:#161310;">{{ .Token }}</div>
      
    </td></tr>
    <tr><td style="padding:20px 4px 0 4px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:17px;color:#8c8175;">
      <span style="letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#4b423a;">Find coffee worth the detour</span><br>
      If you didn't ask for this, ignore this email and consider changing your password.
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
